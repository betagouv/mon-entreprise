name: Déploiement PR
# Déclenché par workflow_run : les secrets sont disponibles, y compris pour les PR de
# fork, qui n'exécutent « Vérification PR » qu'après approbation d'un mainteneur.
# Le code d'une PR est checkouté dans pr/ pour être déployé, jamais exécuté ici.
on:
  workflow_run:
    workflows: ['Vérification PR']
    types: [completed]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  deployments: write
  actions: read

jobs:
  deploy-context:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      pr_number: ${{ steps.pr-context.outputs.pr_number }}
      env_name: ${{ steps.pr-context.outputs.env_name }}
      fr_url: ${{ steps.pr-context.outputs.fr_url }}
      en_url: ${{ steps.pr-context.outputs.en_url }}
    steps:
      - name: Download PR context artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read PR context
        id: pr-context
        run: |
          echo "pr_number=$(jq -r .pr_number pr-context.json)" >> $GITHUB_OUTPUT
          echo "env_name=$(jq -r .env_name pr-context.json)" >> $GITHUB_OUTPUT
          echo "fr_url=$(jq -r .fr_url pr-context.json)" >> $GITHUB_OUTPUT
          echo "en_url=$(jq -r .en_url pr-context.json)" >> $GITHUB_OUTPUT

  algolia-push:
    needs: deploy-context
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algolia-data
          path: ${{ runner.temp }}/algolia-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Place Algolia data
        run: cp "${{ runner.temp }}/algolia-data/algolia-data.json" site/algolia-data.json
      - name: Push Algolia index
        run: yarn workspace site algolia:push
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          ALGOLIA_INDEX_PREFIX: monentreprise-${{ needs.deploy-context.outputs.env_name }}-

  deploy-preview:
    needs: deploy-context
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        site: ['', 'en']
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-storybook
          path: dist/dev/storybook
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: deploy-netlify
        uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654 # v3.0.0
        with:
          publish-dir: './dist'
          netlify-config-path: ./netlify.toml
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-commit-status: true
          enable-commit-comment: false
          github-deployment-environment: ${{ needs.deploy-context.outputs.env_name }}
          alias: ${{ needs.deploy-context.outputs.env_name }}${{ matrix.site && format('-{0}', matrix.site) }}
          deploy-message: PR #${{ needs.deploy-context.outputs.pr_number }} (${{ matrix.site || 'fr' }})
          fails-without-credentials: true
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 3

  review-app-clevercloud:
    needs: deploy-context
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: review-app-clevercloud-${{ needs.deploy-context.outputs.pr_number }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      CLEVER_ORGA_ID: ${{ secrets.CLEVER_ORGA_ID }}
      APP_NAME: mon-entreprise-pr-${{ needs.deploy-context.outputs.pr_number }}
    steps:
      - name: Checkout de la branche par défaut
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout du code de la PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/pull/${{ needs.deploy-context.outputs.pr_number }}/merge
          path: pr
          fetch-depth: 0
      - uses: ./.github/actions/clever-tools
      - name: Préparer l'application
        working-directory: pr
        run: |
          if ! clever link --org "$CLEVER_ORGA_ID" "$APP_NAME"; then
            clever create --type node "$APP_NAME" --alias "$APP_NAME" --org "$CLEVER_ORGA_ID" --region par
            clever domain add "$APP_NAME.cleverapps.io"
          fi
          clever scale --flavor XS
          clever scale --build-flavor XL
      - name: Déployer la review app
        id: deploy
        working-directory: pr
        run: |
          git switch -c "$APP_NAME"
          clever env import < "$GITHUB_WORKSPACE/clevercloud/next-fr.env"
          clever deploy --force --same-commit-policy rebuild
          echo "url=https://$APP_NAME.cleverapps.io" >> "$GITHUB_OUTPUT"

  post-comment:
    needs: [deploy-preview, deploy-context, review-app-clevercloud]
    if: ${{ !cancelled() && needs.deploy-preview.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ needs.deploy-context.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: netlify
      - name: Create comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ needs.deploy-context.outputs.pr_number }}
          edit-mode: replace
          body: |
            La branche est déployée !

            - mon-entreprise : ${{ needs.deploy-context.outputs.fr_url }}
            - mycompanyinfrance : ${{ needs.deploy-context.outputs.en_url }}
            - storybook : ${{ needs.deploy-context.outputs.fr_url }}/dev/storybook/ ([version EN](${{ needs.deploy-context.outputs.en_url }}/dev/storybook/))
            - API : ${{ needs.deploy-context.outputs.fr_url }}/api/v1/doc/
            ${{ needs.review-app-clevercloud.outputs.url && format('- Next.js sur Clever Cloud : {0}', needs.review-app-clevercloud.outputs.url) || '' }}
