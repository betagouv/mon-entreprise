impôt . barème standard . revenu net imposable:
  description.en: >
    [automatic] Net taxable income** is overall net income after special
    allowances.


    You can benefit from a special allowance if one of the following conditions
    applies to you 

    following conditions:

    - you are 65 or over,

    - you are disabled,

    - you are attaching a married or civil union child to your household.


    These allowances are not yet implemented in our simulators.
  description.fr: >
    Le **revenu net imposable** est le revenu net global après abattements
    spéciaux.


    Vous pouvez bénéficier d’un abattement spécial si vous êtes dans l’une des 

    conditions suivantes :

    - vous avez 65 ans ou plus,

    - vous êtes invalide,

    - vous rattachez votre enfant marié, pacsé ou chargé de famille.


    Ces abattements ne sont pas encore implémentés dans nos simulateurs.
