établissement . taux ATMP:
  description.en: >
    [automatic] The AT/MP contribution rate is determined for each establishment
    on the basis of the following factors

    based on the following factors :


    - Main activity

    - Size of establishment

    - Sector of activity

    - Frequency and severity of claims (work-related accidents, occupational

    - illnesses)


    If you don't know the company's rate, click on "Skip".
  description.fr: >
    Le taux de la cotisation AT/MP est déterminé pour chaque établissement en

    fonction des éléments suivants :


    - Activité principale

    - Taille de l'établissement

    - Secteur d'activité

    - Fréquence et la gravité des sinistres survenus (accidents du travail,
    maladies

    - professionnelles)


    Si vous ne connaissez pas le taux de l'établissement, cliquez sur
    « Passer ».
