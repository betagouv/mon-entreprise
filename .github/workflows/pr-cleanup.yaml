name: Nettoyage PR
# Utilise pull_request_target (au lieu de pull_request) pour avoir accès aux secrets
# même pour les PR de fork. Ne jamais y checkouter le code d'une PR : il s'exécuterait
# avec ces secrets. Les jobs ci-dessous n'exécutent que du code de la branche par défaut.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  deploy-context:
    runs-on: ubuntu-22.04
    outputs:
      env-name: ${{ steps.deploy-env.outputs.name }}
    steps:
      - id: deploy-env
        run: echo "name=${{ github.event.number }}" >> $GITHUB_OUTPUT

  algolia-rm-temp-index:
    needs: deploy-context
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install
      - name: Remove temporary Algolia index
        run: yarn workspace site algolia:clean
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          ALGOLIA_INDEX_PREFIX: monentreprise-${{ needs.deploy-context.outputs.env-name }}-

  clevercloud-review-app-rm:
    runs-on: ubuntu-22.04
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      CLEVER_ORGA_ID: ${{ secrets.CLEVER_ORGA_ID }}
      APP_NAME: mon-entreprise-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install clever-tools
        run: npm install --global clever-tools@4.11.0
      - name: Supprimer la review app
        timeout-minutes: 5
        run: |
          if clever link --org "$CLEVER_ORGA_ID" "$APP_NAME"; then
            clever delete --yes
          else
            echo "Aucune review app pour la PR ${{ github.event.number }}"
          fi
