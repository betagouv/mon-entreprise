name: Sonde token cross-repo
# Jetable : mesure si le GITHUB_TOKEN d'un workflow peut lire les PR associées à un commit dans le
# dépôt d'un fork. La réponse est la conclusion de chaque job, lisible sans authentification :
# job vert = lecture autorisée et PR attendue trouvée. À supprimer avec sa branche.
on: push

permissions:
  contents: read
  pull-requests: write

jobs:
  fork-ibzer:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trouve="$(gh api "repos/Ibzer/mon-entreprise/commits/5bc1677eeb1fca16b1820b3c002432c6de602842/pulls" \
            | jq -r '[.[] | select(.base.repo.full_name == "betagouv/mon-entreprise")] | .[0].number // empty')"
          echo "trouvé : [$trouve], attendu : [4707]"
          [ "$trouve" = 4707 ]

  fork-catwallon:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trouve="$(gh api "repos/Catwallon/mon-entreprise/commits/ba3ec0e3e9a43c4b37152420009607107e760bb5/pulls" \
            | jq -r '[.[] | select(.base.repo.full_name == "betagouv/mon-entreprise")] | .[0].number // empty')"
          echo "trouvé : [$trouve], attendu : [4702]"
          [ "$trouve" = 4702 ]

  fork-sha-depasse:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trouve="$(gh api "repos/Catwallon/mon-entreprise/commits/1f902eb7fb/pulls" \
            | jq -r '[.[] | select(.base.repo.full_name == "betagouv/mon-entreprise")] | .[0].number // empty')"
          echo "trouvé : [$trouve], attendu : [4701]"
          [ "$trouve" = 4701 ]

  temoin-public-tiers:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/octocat/Hello-World --jq .full_name

  temoin-interne:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trouve="$(gh api "repos/$GITHUB_REPOSITORY/commits/394bdd637ebc5135fd8ada9567829242b9bb9a2b/pulls" \
            | jq -r '.[0].number // empty')"
          echo "trouvé : [$trouve], attendu : [4686]"
          [ "$trouve" = 4686 ]
