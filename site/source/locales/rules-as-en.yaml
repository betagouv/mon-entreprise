impôt . barème standard . revenu brut global:
  description.en: |
    [automatic] Total gross income** is the sum of all income after deductions:
    - net taxable salary,
    - profits (BIC and BNC),
    - dividends.

    Our simulators do not yet include all the income to be included:
    - pensions and retirement,
    - agricultural profits (BA),
    - property income,
    - other income from movable property and capital gains on securities,
    - real estate capital gains.
  description.fr: >
    Le **revenu brut global** est la somme de tous les revenus, après leur
    abattement :

    - salaire net imposable,

    - bénéfices (BIC et BNC),

    - dividendes.


    Nos simulateurs n’intègrent pas encore tous les revenus à intégrer :

    - pensions et retraites,

    - bénéfices agricoles (BA),

    - revenus fonciers,

    - autres revenus mobiliers et plus-values sur valeurs mobilières,

    - plus-values immobilières.
  titre.en: '[automatic] gross aggregate income'
  titre.fr: revenu brut global
