  description.en: >
    [automatic] We've implemented three ways of calculating income tax:

    - the personalized rate*: indicated on your tax notice

    - the neutral rate*: for a single person with no children

    - *The standard rate scale*: the "official" formula used by the tax

    tax authorities to obtain the tax rate


    By filling in your personalized rate, you'll be as close as possible to your

    situation. The neutral rate can be useful if you haven't

    you have not sent your personalized rate to your employer, and you wish to

    compare the simulator results with your pay slip. The standard scale

    gives you a more accurate result than the neutral rate for a single person
    with no

    child.
  description.fr: >
    Nous avons implémenté trois façon de calculer l’impôt sur le revenu :

    - *Le taux personnalisé* : indiqué sur votre avis d’imposition

    - *Le taux neutre* : pour un célibataire sans enfant

    - *Le barème standard * : la formule "officielle" utilisée par
    l’administration

    fiscale pour obtenir le taux d’imposition


    En remplissant votre taux personnalisé, vous serez au plus proche de votre

    situation réelle. Le taux neutre peut être intéressant dans le cas où vous

    n’avez pas transmis votre taux personnalisé à l’employeur et que vous
    souhaitez

    comparer les résultats du simulateur à votre fiche de paie. Le barème
    standard

    vous donne un résultat plus précis que le taux neutre pour un célibataire
    sans

    enfant.
