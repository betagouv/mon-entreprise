protection sociale . famille:
  description.en: >
    [automatic] Created in 1945, the Family branch is one of the key players in
    French family

    family policy. It currently has two priority missions:
      - To help families in their day-to-day lives, and in particular to facilitate
      reconciling family and professional life;
      - Develop solidarity with the most vulnerable, including the disabled.
      the disabled.

    To fulfill these missions, it relies on two levers:
      - The payment of financial benefits to families (family and social benefits
      and social benefits, housing assistance and minimum social benefits such as the
      and the revenu de solidarité active);
      - Supporting families and setting up or co-financing various services and
      services and facilities for families (such as day-care centres).
      crèches)
  description.fr: >
    Créée en 1945, la branche Famille est l’un des principaux acteurs de la

    politique familiale française. Actuellement, elle a deux missions
    prioritaires :
      - Aider les familles dans leur vie quotidienne, faciliter, en particulier, la
      conciliation entre vie familiale et vie professionnelle ;
      - Développer la solidarité envers les plus vulnérables, dont les personnes
      handicapées.

    Pour remplir ces missions, elle s’appuie sur deux leviers :
      - Le versement de prestations financières aux familles (prestations familiales
      et sociales, aides au logement et minima sociaux comme l’aide aux adultes
      handicapés et le revenu de solidarité active) ;
      - L’accompagnement des familles et la mise en place ou le cofinancement de
      différents services et équipements collectifs qui leur sont destinés (comme
      les crèches)
  résumé.en: |
    [automatic] Provides family support services: childcare, housing assistance
    assistance...
  résumé.fr: |
    Assure des prestations en soutien aux familles : garde d’enfants, aide au
