assimilé salarié . exonérations . Acre:
  description.en: >
    [automatic] Assistance for setting up or taking over a business (Acre)

    consists of a **partial exemption** from social security contributions

    for 12 months, known as the start-up exemption.


    To qualify, you must **apply to Urssaf** within

    within 60 days of setting up your business.


    You can only benefit from Acre if you are in one of the following situations

    **one of the following situations** at the time of setting up your business:

    - a job-seeker receiving compensation ;

    - a job-seeker who is not receiving compensation but is registered with
    France Travail

    6 months in the last 18 months;

    - beneficiary of the revenu de solidarité active (RSA) or the allocation de

    solidarité spécifique (ASS) ;

    - young people aged 18 to 25;

    - person under 30 not receiving compensation (insufficient length of
    employment to

    for entitlement);

    - disabled persons under 30;

    - salaried employees or those made redundant by a company in receivership or
    liquidation

    or liquidation and who takes over the business of this company;

    - a person who has signed a Cape (contrat d'appui au projet d'entreprise),
    provided that

    provided they meet one of the above seven conditions on the date of signing

    on the date the contract is signed;

    - a person setting up a business in a priority district of the

    priority district (QPV);

    - beneficiary of the "prestation partagée d'éducation de l'enfant" (PrePare)
    ;

    - person carrying on business in a France ruralités revitalization zone

    (ZFRR) or a France ruralités revitalization "plus" zone (ZFRR+).


    Prior to 2026, Acre was awarded automatically to all business

    business creators.


    In addition, to be eligible for Acre, you must not have received it

    in the previous three years.
  description.fr: >
    L’aide à la création ou à la reprise d’une entreprise (Acre)

    consiste en une **exonération partielle** de charges sociales

    pendant 12 mois, dite exonération de début d’activité.


    Pour pouvoir en bénéficier vous devez **déposer une demande auprès de
    l’Urssaf**

    dans un délai de 60 jours après la création de votre entreprise.


    Vous ne pouvez bénéficier de l’Acre que si vous êtes dans l’

    **une des situations suivantes** au moment de la création de votre
    entreprise :

    - personne demandeuse d’emploi indemnisée ;

    - personne demandeuse d’emploi non indemnisée mais inscrite à France Travail

    6 mois au cours des 18 derniers mois ;

    - bénéficiaire du revenu de solidarité active (RSA) ou de l’allocation de

    solidarité spécifique (ASS) ;

    - jeune de 18 à 25 ans révolus ;

    - personne de moins de 30 ans non indemnisée (durée d’activité insuffisante
    pour

    l’ouverture de droits) ;

    - personne de moins de 30 ans reconnue handicapée ;

    - personne salariée ou licenciée d’une entreprise en sauvegarde, en
    redressement

    ou en liquidation judiciaire et qui reprend l’activité de cette entreprise ;

    - personne ayant conclu un Cape (contrat d’appui au projet d’entreprise),
    sous

    réserve qu’elle remplisse l’une des sept conditions ci-dessus à la date

    de signature de ce contrat ;

    - personne créant une entreprise implantée au sein d’un quartier prioritaire
    de

    la politique de la ville (QPV) ;

    - bénéficiaire de la prestation partagée d’éducation de l’enfant (PrePare) ;

    - personne exerçant l’activité au sein d’une zone France ruralités
    revitalisation

    (ZFRR) ou d’une zone France ruralités revitalisation « plus » (ZFRR+).


    Avant 2026, l'attribution de l’Acre était automatique et concernait tous les

    créateurs et créatrices d’entreprise.


    Par ailleurs, pour bénéficier de l’Acre, vous ne devez pas en avoir déjà

    bénéficié au cours des trois années précédentes.
  question.en: '[automatic] Did you benefit from Acre?'
  question.fr: Bénéficiez-vous de l’Acre ?
  titre.en: '[automatic] Acre'
  titre.fr: Acre
assimilé salarié . exonérations . JEI:
  description.en: >-
    [automatic] The status of “young innovative company” (JEI) was established
    by the 2004 Finance Act and allows small and medium-sized enterprises (SMEs)
    that are less than 8 years old and devote at least 20% of their expenses to
    research and development to benefit from an exemption from social security
    contributions.


    The exemption may apply to compensation paid to:

    - employees for whom the employer is subject to the obligation to provide
    unemployment insurance

    - corporate officers who participate, as their primary occupation, in the
    company’s research and development project


    For simplicity’s sake, an employee will be deemed eligible for the exemption
    as long as at least half of their working time is devoted to one or more
    research and development projects, and the exemption cannot be revoked.
  description.fr: >-
    Le statut de jeune entreprise innovante (JEI) a été créé par la loi de
    finances pour 2004 et permet aux PME de moins de 8 ans consacrant 20% au
    moins de leurs charges à de la Recherche et Développement de bénéficier
    d'une exonération de cotisations sociales.


    L’exonération peut s’appliquer sur les rémunérations versées :

    - aux salariés pour lesquels l’employeur est soumis à l’obligation
    d’assurance chômage

    - aux mandataires sociaux qui participent, à titre principal, au projet de
    recherche et de développement de l’entreprise


    Par simplification, le bénéfice de l’exonération au titre d’un salarié sera
    considéré comme acquis dès lors que la moitié de son temps de travail au
    moins est consacrée à un ou des projets de recherche et de développement et
    l’exonération ne pourra être remise en cause.
  question.en:
    '[automatic] Do you qualify for the Young Innovative Company (JEI)
    tax exemption?'
  question.fr: Bénéficiez-vous de l'exonération Jeune Entreprise Innovante (JEI) ?
  titre.en: '[automatic] JEI'
  titre.fr: JEI
